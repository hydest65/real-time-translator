<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subtitle Studio UI Editor</title>
    <link rel="stylesheet" href="/static/ui-editor.css?v=ui-editor-20260430" />
  </head>
  <body>
    <main class="editor-shell">
      <section class="control-panel" aria-label="UI editor controls">
        <div class="editor-heading">
          <p class="eyebrow">Subtitle Studio</p>
          <h1>UI Editor</h1>
          <p>Adjust colors, caption sizes, and layout. Preview changes on the right.</p>
        </div>

        <div class="control-group">
          <h2>Colors</h2>
          <label>
            Background
            <input type="color" data-theme-key="--bg" value="#e8edf5" />
          </label>
          <label>
            Panel
            <input type="color" data-theme-key="--bg-soft" value="#edf2f8" />
          </label>
          <label>
            Primary action / translated captions
            <input type="color" data-theme-key="--accent-strong" value="#3f54d2" />
          </label>
          <label>
            Body text
            <input type="color" data-theme-key="--text" value="#3f4a58" />
          </label>
        </div>

        <div class="control-group">
          <h2>Captions</h2>
          <label>
            Translation font size
            <input type="range" data-theme-key="--subtitle-font-size" min="12" max="96" value="32" data-unit="px" />
            <span data-output-for="--subtitle-font-size">32px</span>
          </label>
          <label>
            Source font size
            <input type="range" data-theme-key="--source-font-size" min="12" max="96" value="18" data-unit="px" />
            <span data-output-for="--source-font-size">18px</span>
          </label>
        </div>

        <div class="control-group">
          <h2>Layout</h2>
          <label>
            Background decoration
            <select data-theme-key="--background-art">
              <option value="radial-gradient(circle at 10% 8%, rgba(240, 244, 250, 0.95), transparent 28%), linear-gradient(145deg, var(--bg) 0%, var(--bg-low) 100%)" selected>Show</option>
              <option value="linear-gradient(145deg, var(--bg) 0%, var(--bg-low) 100%)">Hide</option>
            </select>
          </label>
          <label>
            Status sidebar width
            <input type="range" data-theme-key="--panel-width" min="180" max="340" value="230" data-unit="px" />
            <span data-output-for="--panel-width">230px</span>
          </label>
          <label>
            Corner radius
            <input type="range" data-theme-key="--ui-radius" min="8" max="34" value="22" data-unit="px" />
            <span data-output-for="--ui-radius">22px</span>
          </label>
        </div>

        <div class="actions">
          <button id="saveTheme">Save to main window</button>
          <button id="resetTheme" class="secondary">Reset defaults</button>
        </div>

        <textarea id="cssOutput" readonly aria-label="Generated CSS"></textarea>
      </section>

      <section class="preview-panel" aria-label="Live preview">
        <iframe id="previewFrame" title="Subtitle Studio preview" src="/"></iframe>
      </section>
    </main>

    <script src="/static/ui-editor.js?v=compact-subtitles-en13-20260502"></script>
  </body>
</html>
